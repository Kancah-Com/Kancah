<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Karier | Kancah Creative</title>
<meta name="description" content="Lowongan full time dan internship di Kancah Creative, creative agency di Yogyakarta.">
<link rel="icon" type="image/png" href="/assets/logowh.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,500;1,700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/kancah.css">
<script>document.documentElement.classList.add('js')</script>
</head>
<body data-page="careers">
<header id="hd"></header>
<main>
<section class="ph sm"><div class="wrap">
<div class="stitle rv"><span>Karier</span><i></i></div>
<h1 class="rv">Bergabung dengan tim <span class="sel">kreatif</span> kami.</h1>
<p class="lead rv">Kami membuka kesempatan bagi talenta kreatif dan digital untuk berkembang bersama Kancah, baik sebagai tim penuh waktu maupun peserta magang.</p>
</div></section>
<section class="light"><div class="wrap">
<div class="flt" id="filters" role="group" aria-label="Filter tipe posisi"><button type="button" data-t="all" aria-pressed="true">Semua Posisi</button><button type="button" data-t="Full-Time" aria-pressed="false">Full Time</button><button type="button" data-t="Internship" aria-pressed="false">Internship</button></div>
<div id="jobs" aria-busy="true"><div class="msg">Memuat posisi...</div></div>
</div></section>
</main>
<footer id="ft"></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/kancah.js"></script>
<script>
const {$,$$,esc,db}=K;
const box=$('#jobs');
async function load(t='all'){
  if(!db){box.innerHTML='<div class="msg">Posisi belum dapat dimuat.</div>';return}
  let q=db.from('careers').select('*').order('created_at',{ascending:false});if(t!=='all')q=q.eq('type',t);
  const {data,error}=await q;box.removeAttribute('aria-busy');
  if(error){console.error(error);box.innerHTML='<div class="msg">Posisi belum dapat dimuat. Silakan muat ulang halaman.</div>';return}
  if(!data.length){box.innerHTML='<div class="msg">Belum ada posisi yang dibuka saat ini.</div>';return}
  box.innerHTML='<div class="rows" style="border-top:1px solid rgba(0,0,0,.25)">'+data.map(j=>`<a class="jb rv" href="detail-careers?id=${encodeURIComponent(j.id)}"><h3>${esc(j.title)}</h3><div class="meta"><span>${esc(j.type)}</span><span>${esc(j.location||'Yogyakarta')}</span></div>${'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg>'}</a>`).join('')+'</div>';
  K.reveal(box);
}
$('#filters').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$$('#filters button').forEach(x=>x.setAttribute('aria-pressed',x===b));load(b.dataset.t)});
load();
</script>
</body>
</html>
