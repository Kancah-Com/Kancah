<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Portfolio | Kancah Creative</title>
<meta name="description" content="Portofolio Kancah Creative: proyek brand design, promotion design, tech development, social media, dan audio visual.">
<link rel="icon" type="image/png" href="/assets/logowh.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,500;1,700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/kancah.css">
<script>document.documentElement.classList.add('js')</script>
</head>
<body data-page="works">
<header id="hd"></header>
<main>
<section class="ph sm"><div class="wrap">
<div class="stitle rv"><span>Portfolio</span><i></i></div>
<h1 class="rv">Karya pilihan dari <span class="sel">berbagai</span> kebutuhan brand.</h1>
<p class="lead rv">Kumpulan proyek identitas, promosi, digital, dan produksi kreatif yang pernah kami kerjakan bersama klien.</p>
</div></section>
<section><div class="wrap">
<div class="flt" id="filters" role="group" aria-label="Filter kategori"></div>
<div class="wgrid" id="grid" aria-busy="true"></div>
</div></section>
<div class="sc" id="sc" role="dialog" aria-modal="true" aria-label="Pratinjau proyek">
 <div class="sc-bar"><div class="t"><button class="ib" id="sc-x" type="button" aria-label="Tutup">&times;</button><b id="sc-t">Pratinjau</b></div>
 <div class="a"><button class="btn" id="sc-c" type="button">Salin Link</button><a class="btn" id="sc-o" href="#" target="_blank" rel="noopener">Buka di Tab Baru</a></div></div>
 <iframe id="sc-f" title="Pratinjau proyek"></iframe>
</div>
</main>
<footer id="ft"></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/kancah.js"></script>
<script>
const {$,$$,esc,db}=K;
const CATS=[['all','Semua'],['Brand Design','Brand Design'],['Promotion Design','Promotion Design'],['Social Media Management','Social Media Management'],['Web Development','Tech Development'],['Audio Visual','Audio Visual']];
const ALLOWED=['Brand Design','Stationery Design','Collateral Design','Promotion Design','Web Development','Social Media Management','Audio Visual'];
const grid=$('#grid'),fl=$('#filters');let all=[],slug='';
fl.innerHTML=CATS.map(([v,l],i)=>`<button type="button" data-c="${esc(v)}" aria-pressed="${i===0}">${l}</button>`).join('');
grid.innerHTML='<div class="wk sk"><div class="fr"></div><div class="ct"><b>Memuat</b></div></div>'.repeat(6);
function draw(f){
  const list=all.filter(p=>f==='all'||p.category===f);
  grid.removeAttribute('aria-busy');
  if(!list.length){grid.innerHTML='<div class="msg">Belum ada proyek pada kategori ini.</div>';return}
  grid.innerHTML=list.map(p=>{const web=(p.category||'').trim()==='Web Development'&&p.demo_url;
    const a=web?`href="#" data-demo="${esc(p.demo_url)}" data-title="${esc(p.title)}" data-slug="${esc(p.slug)}"`:`href="detail-project?id=${encodeURIComponent(p.slug)}"`;
    return `<a class="wk rv" ${a}><div class="fr"><img src="${esc(p.image_url)}" alt="${esc(p.title)}" loading="lazy" onerror="this.remove()"></div><div class="ct"><b>${esc(p.title)}</b><span>${esc(p.category)}</span></div></a>`}).join('');
  K.reveal(grid);
}
fl.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$$('button',fl).forEach(x=>x.setAttribute('aria-pressed',x===b));draw(b.dataset.c)});
(async()=>{
  if(!db){grid.innerHTML='<div class="msg">Portofolio belum dapat dimuat. Silakan muat ulang halaman.</div>';return}
  const {data,error}=await db.from('projects').select('*').order('created_at',{ascending:false});
  if(error){console.error(error);grid.innerHTML='<div class="msg">Portofolio belum dapat dimuat. Silakan muat ulang halaman.</div>';return}
  all=(data||[]).filter(p=>ALLOWED.includes(p.category));draw('all');
})();
/* pratinjau proyek web */
const sc=$('#sc'),sf=$('#sc-f');
grid.addEventListener('click',async e=>{const a=e.target.closest('a[data-demo]');if(!a||e.metaKey||e.ctrlKey)return;e.preventDefault();
  slug=a.dataset.slug;$('#sc-t').textContent=a.dataset.title;$('#sc-o').href=location.origin+'/preview/'+encodeURIComponent(slug);
  sc.classList.add('open');document.body.classList.add('lock');sf.srcdoc='';
  try{const r=await fetch(a.dataset.demo);if(!r.ok)throw 0;const h=await r.text();
    sf.srcdoc=h+'<script>document.addEventListener("click",function(e){if(e.target.closest("a"))e.preventDefault()})<\/script>'}
  catch(_){sf.srcdoc='<p style="font-family:sans-serif;padding:40px">Pratinjau tidak dapat dimuat.</p>'}
});
function closeSc(){sc.classList.remove('open');document.body.classList.remove('lock');sf.srcdoc=''}
$('#sc-x').onclick=closeSc;addEventListener('keydown',e=>{if(e.key==='Escape'&&sc.classList.contains('open'))closeSc()});
$('#sc-c').onclick=async()=>{try{await navigator.clipboard.writeText(location.origin+'/preview/'+encodeURIComponent(slug));K.toast('Link berhasil disalin.')}catch(_){K.toast('Link tidak dapat disalin.',true)}};
</script>
</body>
</html>
