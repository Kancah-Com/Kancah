<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Journal | Kancah Creative</title>
<link rel="icon" type="image/png" href="/assets/logowh.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,500;1,700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/kancah.css">
<script>document.documentElement.classList.add('js')</script>
<meta id="meta-desc" name="description" content="Membaca tulisan terbaru dari Kancah Creative.">
<meta property="og:type" content="article">
<meta id="og-title" property="og:title" content="Kancah Creative">
<meta id="og-image" property="og:image" content="">
</head>
<body data-page="blog">
<header id="hd"></header>
<main>
<section class="ph sm"><div class="wrap" style="max-width:900px"><div class="stitle"><span id="p-date">Journal</span><i></i></div><h1 id="p-title" style="font-size:clamp(34px,5.2vw,76px)">Memuat...</h1></div></section>
<section class="light"><div class="wrap" style="max-width:860px">
<div class="fr" style="aspect-ratio:16/9;border-radius:16px;margin-bottom:clamp(28px,4vw,56px)"><img id="p-img" alt="" style="object-position:center"></div>
<div class="prose" id="p-body"></div>
<a class="btn" href="blog" style="margin-top:clamp(32px,4vw,56px)">Kembali ke Journal</a>
</div></section>
</main>
<footer id="ft"></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/kancah.js"></script>
<script>
const {$,db}=K;
const slug=new URLSearchParams(location.search).get('slug')||location.pathname.split('/').filter(Boolean).pop();
(async()=>{
  const {data,error}=await db.from('posts').select('*').ilike('slug',slug).maybeSingle();
  if(error)console.error(error);
  if(error||!data){$('#p-title').textContent='Tulisan tidak ditemukan';$('#p-img').closest('.fr').hidden=true;return}
  document.title=data.title+' | Kancah Creative';
  $('#p-title').textContent=data.title;
  $('#p-date').textContent=new Date(data.created_at).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
  $('#p-img').src=data.image_url;$('#p-img').alt=data.title;$('#p-body').innerHTML=data.content_html||'';
  const set=(s,a,v)=>{const m=document.querySelector(s);if(m)m.setAttribute(a,v)};
  set('#meta-desc','content',data.excerpt||'');set('#og-title','content',data.title);set('#og-image','content',data.image_url||'');
})();
</script>
</body>
</html>
