<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Journal | Kancah Creative</title>
<meta name="description" content="Pemikiran, strategi, dan cerita di balik layar Kancah Creative.">
<link rel="icon" type="image/png" href="/assets/logowh.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,500;1,700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/kancah.css">
<script>document.documentElement.classList.add('js')</script>
</head>
<body data-page="blog">
<header id="hd"></header>
<main>
<section class="ph sm"><div class="wrap">
<div class="stitle rv"><span>Journal</span><i></i></div>
<h1 class="rv">Pemikiran, strategi, dan <span class="sel">cerita</span> dari balik layar.</h1>
<p class="lead rv">Catatan dari tim Kancah Creative tentang brand, desain, dan teknologi.</p>
</div></section>
<section><div class="wrap"><div class="bgrid" id="bg"><div class="msg">Memuat tulisan...</div></div></div></section>
</main>
<footer id="ft"></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/kancah.js"></script>
<script>
const {$,esc,db}=K,g=$('#bg');
(async()=>{
  if(!db){g.innerHTML='<div class="msg">Tulisan belum dapat dimuat.</div>';return}
  const {data,error}=await db.from('posts').select('*').order('created_at',{ascending:false});
  if(error){console.error(error);g.innerHTML='<div class="msg">Tulisan belum dapat dimuat. Silakan muat ulang halaman.</div>';return}
  if(!data||!data.length){g.innerHTML='<div class="msg">Belum ada tulisan.</div>';return}
  g.innerHTML=data.map(p=>`<article class="rv"><a href="/${encodeURIComponent(p.slug)}"><div class="fr"><img src="${esc(p.image_url)}" alt="${esc(p.title)}" loading="lazy"></div><h3>${esc(p.title)}</h3><p>${esc(p.excerpt)}</p></a></article>`).join('');
  K.reveal(g);
})();
</script>
</body>
</html>
