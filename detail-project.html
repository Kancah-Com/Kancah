<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Detail Proyek | Kancah Creative</title>
<meta name="description" content="Detail proyek dari Kancah Creative.">
<link rel="icon" type="image/png" href="/assets/logowh.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,500;1,700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/kancah.css">
<script>document.documentElement.classList.add('js')</script>
</head>
<body data-page="works">
<header id="hd"></header>
<main>
<div class="dp-img"><img id="p-img" alt=""></div>
<section class="light" style="padding-top:clamp(32px,4vw,56px)"><div class="wrap" style="max-width:1100px">
<div class="dp-h"><div><span class="lbl2" id="p-cat" style="display:block;margin:0"></span><h1 id="p-title">Memuat...</h1><p class="desc" id="p-desc" hidden></p></div><div class="tg" id="p-tags"></div></div>
<article id="pc"></article>
<nav class="pn" id="pn" hidden aria-label="Proyek lainnya"><a id="pn-prev" href="#" hidden><small>Sebelumnya</small><span id="pn-pt"></span></a><a id="pn-next" href="#" hidden><small>Berikutnya</small><span id="pn-nt"></span></a></nav>
</div></section>
<section class="light" id="more" style="padding-top:0"><div class="wrap" style="max-width:1100px"><div class="sh"><h2>Karya <span class="sel">lainnya</span></h2><div><a class="btn" href="works">Lihat Semua Proyek</a></div></div><div class="wgrid" id="mg"></div></div></section>
</main>
<footer id="ft"></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/kancah.js"></script>
<script>
const {$,esc,db}=K;
function trim(){const c=$('#pc');if(!c)return;c.style.height='auto';
  c.querySelectorAll('p,div').forEach(el=>{if(el.innerHTML.replace(/<br>|&nbsp;|\s/g,'')===''&&!el.querySelector('img,iframe,video'))el.style.display='none'});
  const top=c.getBoundingClientRect().top;let m=0;
  c.querySelectorAll('img,iframe,video,h1,h2,h3,h4,p,blockquote,ul,ol').forEach(el=>{if(/^(IMG|IFRAME|VIDEO)$/.test(el.tagName)||el.textContent.trim()){const r=el.getBoundingClientRect();if(r.height>0)m=Math.max(m,r.bottom-top)}});
  if(m>0)c.style.height=m+'px'}
async function adjacent(slug){
  const {data}=await db.from('projects').select('slug,title').order('id',{ascending:true});if(!data||data.length<2)return;
  const i=data.findIndex(p=>p.slug===slug);if(i<0)return;const pv=data[(i-1+data.length)%data.length],nx=data[(i+1)%data.length];
  $('#pn-prev').href='?id='+encodeURIComponent(pv.slug);$('#pn-pt').textContent=pv.title;$('#pn-prev').hidden=false;
  $('#pn-next').href='?id='+encodeURIComponent(nx.slug);$('#pn-nt').textContent=nx.title;$('#pn-next').hidden=false;$('#pn').hidden=false}
async function more(slug){
  const {data}=await db.from('projects').select('slug,title,image_url,category').order('created_at',{ascending:false}).limit(4);
  const l=(data||[]).filter(p=>p.slug!==slug).slice(0,3);if(!l.length){$('#more').hidden=true;return}
  $('#mg').innerHTML=l.map(p=>`<a class="wk" href="?id=${encodeURIComponent(p.slug)}"><div class="fr"><img src="${esc(p.image_url)}" alt="${esc(p.title)}" loading="lazy"></div><div class="ct"><b>${esc(p.title)}</b><span>${esc(p.category)}</span></div></a>`).join('')}
(async()=>{
  const slug=new URLSearchParams(location.search).get('id');if(!slug){location.href='works';return}
  const {data:p,error}=await db.from('projects').select('*').eq('slug',slug).single();
  if(error||!p){$('#p-title').textContent='Proyek tidak ditemukan';return}
  document.title=`${p.title} | Kancah Creative`;
  $('#p-title').textContent=p.title;$('#p-cat').textContent=p.category||'';$('#p-img').src=p.image_url;$('#p-img').alt=p.title;
  if(p.description){$('#p-desc').textContent=p.description;$('#p-desc').hidden=false}
  let t='';if(p.year)t+=`<small>Tahun ${esc(p.year)}</small>`;if(Array.isArray(p.tags))p.tags.forEach(x=>t+=`<span>${esc(x)}</span>`);$('#p-tags').innerHTML=t;
  if(p.content_html&&p.content_html.trim()){const c=$('#pc');c.innerHTML=p.content_html;c.querySelectorAll('img').forEach(i=>i.addEventListener('load',trim));let n=0;const iv=setInterval(()=>{trim();if(++n>15)clearInterval(iv)},200);trim()}
  adjacent(slug);more(slug);
})();
addEventListener('resize',trim);
</script>
</body>
</html>
