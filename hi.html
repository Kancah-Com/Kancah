<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Links • Kancah Creative</title>
<link rel="icon" type="image/png" href="./assets/logowh.png">
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100svh;font:300 16px/1.55 'Ubuntu',system-ui,sans-serif;color:#fff;background:radial-gradient(95% 60% at 50% 112%,rgba(0,6,255,.6) 0%,rgba(0,6,255,.2) 40%,#000 78%) #000;display:flex;flex-direction:column;align-items:center;padding:clamp(40px,8vh,80px) 20px 28px}
.logo{height:30px;filter:brightness(0) invert(1)}
h1{font-weight:400;letter-spacing:-.04em;line-height:1.05;font-size:clamp(34px,8vw,52px);margin:28px 0 8px;text-align:center}
h1 em{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:1.14em}
.sub{opacity:.7;font-size:15px;text-align:center;margin-bottom:32px}
#list{width:100%;max-width:520px;display:grid;gap:12px}
.lk{position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 24px;border:1px solid rgba(255,255,255,.3);border-radius:999px;font-weight:500;font-size:14px;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.04);backdrop-filter:blur(8px);transition:background .3s,transform .3s}
.lk:hover{background:rgba(255,255,255,.14);transform:translateY(-2px)}
.lk span:last-child{font-size:18px}
.msg{text-align:center;opacity:.7;padding:24px 0}
footer{margin-top:auto;padding-top:40px;font-size:12px;opacity:.6;text-align:center}
</style>
</head>
<body>
<a href="/"><img class="logo" src="assets/kancah-logo.png" alt="Kancah"></a>
<h1>Kancah <em>Links</em></h1>
<p class="sub">Semua yang perlu kamu tahu tentang Kancah Creative.</p>
<div id="list"><p class="msg">Memuat...</p></div>
<footer>&copy; <span id="yr"></span> Kancah Creative &middot; #DreamPlayCreate</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient('https://hmzwjceomnneiczbpban.supabase.co', 'sb_publishable_s5OWo5nHTHSv_MLYUxRLoA_xh97qS__');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('yr').textContent = new Date().getFullYear();
const list = document.getElementById('list');

(async () => {
  const { data, error } = await sb.from('links').select('*').order('sort_order', { ascending: true });
  if (error || !data || !data.length) { list.innerHTML = '<p class="msg">Belum ada link.</p>'; return; }
  list.innerHTML = data.map(l => `<a class="lk" href="${esc(l.url)}" data-id="${esc(l.id)}"><span>${esc(l.title)}</span><span>↗</span></a>`).join('');
})();

// hitung klik lewat fungsi database, lalu buka link (maks tunggu 800ms supaya tidak terasa lambat)
list.addEventListener('click', async e => {
  const a = e.target.closest('a.lk'); if (!a || e.metaKey || e.ctrlKey) return;
  e.preventDefault();
  const id = isNaN(a.dataset.id) ? a.dataset.id : Number(a.dataset.id);
  await Promise.race([sb.rpc('increment_link_clicks', { link_id: id }).catch(() => {}), new Promise(r => setTimeout(r, 800))]);
  location.href = a.href;
});
</script>
</body>
</html>
