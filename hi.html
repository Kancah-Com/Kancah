<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Links • Kancah Creative</title>
<link rel="icon" type="image/png" href="./assets/logowh.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0006ff;
  --ink:#000;
  --white:#fff;
  --serif:'Instrument Serif',Georgia,serif;
  --sans:'Ubuntu',system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%;background:#000}
body{
  min-height:100svh;
  padding:clamp(42px,8vh,80px) 20px 26px;
  display:flex;flex-direction:column;align-items:center;
  overflow-x:clip;
  color:var(--white);
  background:radial-gradient(95% 60% at 50% 112%,rgba(0,6,255,.6) 0%,rgba(0,6,255,.25) 40%,#000 78%) #000;
  font:300 16px/1.55 var(--sans);
  letter-spacing:-.005em;
}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid #fff;outline-offset:5px}

/* Brand */
.brand{display:inline-flex;align-items:center;justify-content:center;min-height:30px}
.logo{height:30px;width:auto;filter:brightness(0) invert(1);opacity:.95;transition:opacity .3s,transform .4s var(--ease)}
.brand:hover .logo{opacity:.7;transform:translateY(-2px)}

/* Page heading */
.heading{width:100%;max-width:620px;text-align:center;margin:28px 0 0}
h1{
  font-size:clamp(42px,8vw,68px);
  line-height:1;
  letter-spacing:-.045em;
  font-weight:400;
}
h1 em{
  font-family:var(--serif);
  font-size:1.13em;
  font-weight:400;
  letter-spacing:-.025em;
}
.sub{
  margin:12px auto 0;
  max-width:36ch;
  color:rgba(255,255,255,.68);
  font-size:clamp(14px,2vw,16px);
  line-height:1.6;
}

/* Links — same restrained pill-outline language as the main site's CTA */
#list{
  width:100%;
  max-width:520px;
  display:grid;
  gap:12px;
  margin-top:clamp(30px,5vh,44px);
}
.lk{
  --line:rgba(255,255,255,.32);
  position:relative;
  isolation:isolate;
  min-height:62px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:15px 22px;
  border:1px solid var(--line);
  border-radius:999px;
  background:rgba(255,255,255,.025);
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);
  font-size:13px;
  font-weight:500;
  letter-spacing:.09em;
  text-transform:uppercase;
  transition:background .35s var(--ease),border-color .35s,transform .35s var(--ease),box-shadow .35s;
  overflow:hidden;
}
.lk::before{
  content:"";
  position:absolute;
  inset:-1px;
  padding:1px;
  border-radius:inherit;
  z-index:-1;
  opacity:.72;
  background:linear-gradient(160deg,transparent 0%,#fff 15%,var(--blue) 20%,transparent 35%,transparent 40%,#fff 55%,var(--blue) 60%,transparent 75%,transparent 80%,#fff 95%,var(--blue) 100%);
  background-size:300% 300%;
  animation:glow 3.8s linear infinite;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  pointer-events:none;
}
@keyframes glow{0%{background-position:15% 15%}100%{background-position:75% 75%}}
.lk span:first-child{min-width:0;overflow-wrap:anywhere}
.lk .arrow{
  flex:none;
  display:grid;
  place-items:center;
  width:30px;height:30px;
  border:1px solid rgba(255,255,255,.28);
  border-radius:50%;
  font-size:16px;
  line-height:1;
  font-weight:300;
  transition:transform .35s var(--ease),background .35s,border-color .35s;
}
.lk:hover,.lk:focus-visible{
  background:rgba(255,255,255,.09);
  border-color:rgba(255,255,255,.62);
  box-shadow:0 10px 34px rgba(0,6,255,.14);
  transform:translateY(-2px);
}
.lk:hover .arrow,.lk:focus-visible .arrow{
  transform:translate(2px,-2px);
  background:var(--blue);
  border-color:rgba(255,255,255,.7);
}
.msg{
  padding:22px 0;
  color:rgba(255,255,255,.62);
  text-align:center;
  font-size:14px;
}
footer{
  width:100%;
  margin-top:auto;
  padding-top:clamp(44px,8vh,76px);
  text-align:center;
  color:rgba(255,255,255,.5);
  font-size:11px;
  font-weight:400;
  letter-spacing:.1em;
  text-transform:uppercase;
}
footer span{color:rgba(255,255,255,.78)}
@media(max-width:600px){
  body{padding:38px 20px 22px}
  .heading{margin-top:26px}
  h1{font-size:clamp(40px,12vw,54px)}
  .sub{font-size:14px;max-width:31ch}
  #list{gap:10px;margin-top:30px}
  .lk{min-height:58px;padding:13px 18px;font-size:12px;letter-spacing:.075em}
  .lk .arrow{width:28px;height:28px}
  footer{padding-top:48px;font-size:10px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<a class="brand" href="/" aria-label="Kembali ke halaman utama Kancah">
  <img class="logo" src="assets/kancah-logo.png" alt="Kancah">
</a>

<main class="heading">
  <h1>Kancah <em>Links</em></h1>
  <p class="sub">Semua yang perlu kamu tahu tentang Kancah Creative.</p>
</main>

<div id="list" aria-live="polite">
  <p class="msg">Memuat...</p>
</div>

<footer>&copy; <span id="yr"></span> <span>Kancah Creative</span> &middot; #DreamPlayCreate</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient(
  'https://hmzwjceomnneiczbpban.supabase.co',
  'sb_publishable_s5OWo5nHTHSv_MLYUxRLoA_xh97qS__'
);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

document.getElementById('yr').textContent = new Date().getFullYear();
const list = document.getElementById('list');

(async () => {
  const { data, error } = await sb
    .from('links')
    .select('*')
    .order('sort_order', { ascending: true });

  if (error || !data || !data.length) {
    list.innerHTML = '<p class="msg">Belum ada link.</p>';
    return;
  }

  list.innerHTML = data.map(l => `
    <a class="lk" href="${esc(l.url)}" data-id="${esc(l.id)}">
      <span>${esc(l.title)}</span>
      <span class="arrow" aria-hidden="true">↗</span>
    </a>
  `).join('');
})();

// Catat klik melalui RPC, lalu arahkan pengunjung ke link tujuan.
list.addEventListener('click', async e => {
  const a = e.target.closest('a.lk');
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;

  e.preventDefault();
  const id = isNaN(a.dataset.id) ? a.dataset.id : Number(a.dataset.id);

  await Promise.race([
    sb.rpc('increment_link_clicks', { link_id: id }).catch(() => {}),
    new Promise(resolve => setTimeout(resolve, 800))
  ]);

  location.href = a.href;
});
</script>
</body>
</html>
