<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Detail Posisi | Kancah Creative</title>
<meta name="description" content="Detail posisi dan formulir lamaran di Kancah Creative.">
<link rel="icon" type="image/png" href="/assets/logowh.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,500;1,700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/kancah.css">
<script>document.documentElement.classList.add('js')</script>
</head>
<body data-page="careers">
<header id="hd"></header>
<main>
<section class="light top-pad"><div class="wrap">
<a class="back" href="careers"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H4M10 6l-6 6 6 6"/></svg>Semua posisi</a>
<div class="split r">
 <div class="jd">
  <div id="skel"><div class="sk-l" style="width:30%"></div><div class="sk-l" style="height:60px;width:80%"></div><div class="sk-l" style="height:120px"></div></div>
  <div id="job" hidden>
   <div class="chips"><span id="j-type"></span><span id="j-loc"></span></div>
   <h1 id="j-title"></h1>
   <div id="s-ov"><h2>Gambaran Peran</h2><p class="ov" id="j-ov"></p></div>
   <div id="s-res"><h2>Tanggung Jawab</h2><ul class="list-ck" id="j-res"></ul></div>
   <div id="s-req"><h2>Kualifikasi</h2><ul class="list-ck" id="j-req"></ul></div>
  </div>
 </div>
 <aside class="sticky"><form class="panel" id="af">
  <h2>Lamar posisi <span class="sel">ini.</span></h2>
  <input type="hidden" id="f-title">
  <label class="fld"><span>Nama lengkap</span><input id="a-name" required autocomplete="name" placeholder="Nama sesuai identitas"></label>
  <div class="f2"><label class="fld"><span>WhatsApp</span><input id="a-wa" type="tel" required autocomplete="tel" placeholder="08xxxxxxxxxx"></label><label class="fld"><span>Instagram</span><input id="a-ig" required placeholder="@username"></label></div>
  <label class="fld"><span>Email</span><input id="a-mail" type="email" required autocomplete="email" placeholder="nama@email.com"></label>
  <label class="fld"><span>Link portofolio</span><input id="a-pf" required placeholder="behance.net/nama atau link lainnya"></label>
  <label class="fld"><span>CV (PDF, maksimal 5 MB)</span><input id="a-cv" type="file" accept="application/pdf" required></label>
  <button class="btn block" id="a-btn" type="submit"><span id="a-lbl">Kirim Lamaran</span></button>
 </form></aside>
</div></div></section>
</main>
<footer id="ft"></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/kancah.js"></script>
<script>
const {$,esc,db}=K;let jobId=null,jobTitle='';
const lines=(t,id,sec)=>{if(!t||!t.trim()){$(sec).hidden=true;return}$(id).innerHTML=t.split('\n').filter(x=>x.trim()).map(x=>`<li>${esc(x.trim())}</li>`).join('')};
function render(j){
  const w=(j.title||'').trim().split(/\s+/);const last=w.pop();
  $('#j-title').innerHTML=(w.length?esc(w.join(' '))+' ':'')+`<span class="sel">${esc(last||'')}</span>`;
  $('#j-type').textContent=j.type||'Full-Time';$('#j-loc').textContent=j.location||'On Site';
  if(j.description)$('#j-ov').textContent=j.description;else $('#s-ov').hidden=true;
  lines(j.responsibilities,'#j-res','#s-res');lines(j.requirements,'#j-req','#s-req');
  $('#f-title').value=j.title||'';document.title=`${j.title} | Karier Kancah Creative`;
  $('#skel').hidden=true;$('#job').hidden=false;
}
(async()=>{
  jobId=new URLSearchParams(location.search).get('id');if(!jobId){location.href='careers';return}
  try{const {data,error}=await db.from('careers').select('*').eq('id',jobId).single();if(error||!data)throw error;jobTitle=data.title||'';render(data)}
  catch(e){$('#skel').innerHTML='<p class="msg">Posisi tidak dapat dimuat. Silakan kembali ke daftar posisi.</p>'}
})();
const url=r=>{r=(r||'').trim();return r&&!/^https?:\/\//i.test(r)?'https://'+r:r};
$('#af').addEventListener('submit',async e=>{e.preventDefault();
  const btn=$('#a-btn'),lb=$('#a-lbl'),old=lb.textContent;btn.disabled=true;lb.textContent='Mengirim...';
  try{
    const cv=$('#a-cv').files[0];if(cv&&cv.size>5*1024*1024)throw new Error('Ukuran CV maksimal 5 MB.');
    let cvUrl=null;
    if(cv){const nm=($('#a-name').value||'pelamar').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-');const path=`cv/${Date.now()}_${nm}.pdf`;
      const {error:ue}=await db.storage.from('applicant-cv').upload(path,cv,{contentType:'application/pdf'});if(ue)throw ue;
      cvUrl=db.storage.from('applicant-cv').getPublicUrl(path).data.publicUrl}
    const {error}=await db.from('applications').insert([{career_id:jobId||null,job_title:($('#f-title').value||jobTitle).trim(),full_name:$('#a-name').value.trim(),email:$('#a-mail').value.trim(),whatsapp:$('#a-wa').value.trim(),instagram:$('#a-ig').value.trim(),portfolio:url($('#a-pf').value),cv_url:cvUrl,status:'New'}]);
    if(error)throw error;
    K.toast('Lamaran berhasil dikirim. Tim kami akan menghubungi Anda.',false,4500);e.target.reset();$('#f-title').value=jobTitle;
  }catch(err){K.toast(err.message||'Lamaran gagal dikirim. Silakan coba lagi.',true,4500)}
  finally{btn.disabled=false;lb.textContent=old}
});
</script>
</body>
</html>
